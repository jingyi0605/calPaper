<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>算账稿纸</title>
  <meta name="description" content="像稿纸一样逐行计算，实时求值、自动保存；财务模式金额四舍五入到分，一键复制人民币大写。完全离线可用。" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1b1e25" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="算账稿纸" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar" aria-label="稿纸列表">
      <div class="sidebar-inner">
        <div class="sidebar-head">
          <span class="sidebar-title">全部稿纸</span>
          <span id="page-count" class="sidebar-count"></span>
        </div>
        <button id="btn-new-page" class="new-page-btn" type="button">
          <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 4.5v11M4.5 10h11"/></svg>
          新建稿纸
        </button>
        <div id="page-list" class="page-list"></div>
      </div>
    </aside>

    <div id="scrim" class="scrim" hidden></div>

    <div class="main-col">
      <header class="topbar">
        <div class="topbar-left">
          <button id="btn-sidebar" class="icon-btn" type="button" title="折叠 / 展开稿纸列表（⌘/Ctrl+B）" aria-label="折叠或展开稿纸列表" aria-expanded="true" aria-controls="sidebar">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.5 6h13M3.5 10h13M3.5 14h13"/></svg>
          </button>
          <div class="brand">
            <img class="brand-logo" src="icons/icon-192.png" alt="" width="28" height="28" />
            <div class="brand-text">
              <span class="brand-name">算账稿纸</span>
              <span class="brand-sub" id="brand-date"></span>
            </div>
          </div>
        </div>

        <div class="tools">
          <button id="btn-finance" class="pill" type="button" title="财务模式：结果四舍五入到分，可复制大写金额" aria-pressed="false">
            <span class="pill-icon">¥</span>
            <span class="pill-text">财务模式</span>
            <span class="pill-dot"></span>
          </button>
          <span class="tool-sep"></span>
          <button id="btn-rename" class="icon-btn" type="button" title="重命名稿纸" aria-label="重命名稿纸">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.6 3.2l3.2 3.2L7 16.2l-4 .8.8-4z"/></svg>
          </button>
          <button id="btn-lock" class="icon-btn" type="button" title="锁定稿纸（防止误改）" aria-label="锁定或解锁稿纸">
            <svg class="ic-lock" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="8.5" width="11" height="8" rx="2"/><path d="M7 8.5V6.4a3 3 0 016 0v2.1"/></svg>
            <svg class="ic-unlock hidden" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="8.5" width="11" height="8" rx="2"/><path d="M7 8.5V6.4a3 3 0 015.9-.7"/></svg>
          </button>
          <button id="btn-image" class="icon-btn" type="button" title="导出当前稿纸为图片" aria-label="导出当前稿纸为图片">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="14" height="13" rx="2.2"/><circle cx="7.2" cy="8" r="1.4"/><path d="M4 14.5l4-4 3 3 2.4-2.4 2.6 2.6"/></svg>
          </button>
          <button id="btn-remove" class="icon-btn danger" type="button" title="删除当前稿纸" aria-label="删除当前稿纸">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 5.5h11M8 5V3.8h4V5M6 5.5l.7 10.2h6.6L14 5.5M8.6 8.5v4.6M11.4 8.5v4.6"/></svg>
          </button>
          <button id="btn-add" class="icon-btn accent" type="button" title="新建稿纸" aria-label="新建稿纸">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 4.5v11M4.5 10h11"/></svg>
          </button>
        </div>
      </header>

      <main id="pad" class="pad"></main>

      <footer class="hints">
        <span id="hint-main">回车换行（财务模式携带金额）· 点击结果复制 · ⌘/Ctrl+B 折叠稿纸列表</span>
        <span id="hint-lock" class="hidden">已锁定 · 点击右上角锁图标解锁</span>
      </footer>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="core.js"></script>
  <script src="app.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
