<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>算账稿纸</title>
  <meta name="description" content="像稿纸一样逐行计算，实时求值、自动保存；财务模式金额四舍五入到分，一键复制人民币大写。完全离线可用。" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1b1e25" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="算账稿纸" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar" aria-label="稿纸列表">
      <div class="sidebar-inner">
        <div class="sidebar-head">
          <span class="sidebar-title">全部稿纸</span>
          <span id="page-count" class="sidebar-count"></span>
        </div>
        <button id="btn-new-page" class="new-page-btn" type="button">
          <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 4.5v11M4.5 10h11"/></svg>
          新建稿纸
        </button>
        <div id="page-list" class="page-list"></div>
      </div>
    </aside>

    <div id="scrim" class="scrim" hidden></div>

    <div class="main-col">
      <header class="topbar">
        <div class="topbar-left">
          <button id="btn-sidebar" class="icon-btn" type="button" title="折叠 / 展开稿纸列表（⌘/Ctrl+B）" aria-label="折叠或展开稿纸列表" aria-expanded="true" aria-controls="sidebar">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.5 6h13M3.5 10h13M3.5 14h13"/></svg>
          </button>
          <div class="brand">
            <img class="brand-logo" src="icons/icon-192.png" alt="" width="28" height="28" />
            <div class="brand-text">
              <span class="brand-name">算账稿纸</span>
              <span class="brand-sub" id="brand-date"></span>
            </div>
          </div>
        </div>

        <div class="tools">
          <button id="btn-finance" class="pill" type="button" title="财务模式：结果四舍五入到分，可复制大写金额" aria-pressed="false">
            <span class="pill-icon">¥</span>
            <span class="pill-text">财务模式</span>
            <span class="pill-dot"></span>
          </button>
          <span class="tool-sep"></span>
          <button id="btn-rename" class="icon-btn" type="button" title="重命名稿纸" aria-label="重命名稿纸">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.6 3.2l3.2 3.2L7 16.2l-4 .8.8-4z"/></svg>
          </button>
          <button id="btn-lock" class="icon-btn" type="button" title="锁定稿纸（防止误改）" aria-label="锁定或解锁稿纸">
            <svg class="ic-lock" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="8.5" width="11" height="8" rx="2"/><path d="M7 8.5V6.4a3 3 0 016 0v2.1"/></svg>
            <svg class="ic-unlock hidden" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="8.5" width="11" height="8" rx="2"/><path d="M7 8.5V6.4a3 3 0 015.9-.7"/></svg>
          </button>
          <button id="btn-image" class="icon-btn" type="button" title="导出当前稿纸为图片" aria-label="导出当前稿纸为图片">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="14" height="13" rx="2.2"/><circle cx="7.2" cy="8" r="1.4"/><path d="M4 14.5l4-4 3 3 2.4-2.4 2.6 2.6"/></svg>
          </button>
          <button id="btn-remove" class="icon-btn danger" type="button" title="删除当前稿纸" aria-label="删除当前稿纸">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 5.5h11M8 5V3.8h4V5M6 5.5l.7 10.2h6.6L14 5.5M8.6 8.5v4.6M11.4 8.5v4.6"/></svg>
          </button>
          <button id="btn-add" class="icon-btn accent" type="button" title="新建稿纸" aria-label="新建稿纸">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 4.5v11M4.5 10h11"/></svg>
          </button>
        </div>
      </header>

      <main id="pad" class="pad"></main>

      <footer class="hints">
        <span id="hint-main" class="hint-desktop">回车换行（财务模式携带金额）· 点击结果复制 · ⌘/Ctrl+B 折叠稿纸列表</span>
        <span id="hint-mobile" class="hint-mobile">点按按键输入 · 点击结果复制</span>
        <span id="hint-lock" class="hidden">已锁定 · 点击右上角锁图标解锁</span>
      </footer>

      <!-- 移动端计算器虚拟键盘（可收起） -->
      <div id="keypad" class="keypad">
        <div class="keypad-head">
          <button id="btn-keypad" class="keypad-toggle" type="button" aria-expanded="true" aria-controls="keypad-grid">
            <svg class="keypad-chevron" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 7.5l4.5 4.5 4.5-4.5"/></svg>
            <span class="keypad-title">计算器键盘</span>
            <span id="keypad-target" class="keypad-target"></span>
            <span id="keypad-action" class="keypad-action">收起</span>
          </button>
          <button id="btn-haptic" class="keypad-haptic on" type="button" aria-pressed="true" title="按键震动" aria-label="按键震动开关">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3.5" width="8" height="17" rx="2.2"/><path d="M4.6 8.5v7M19.4 8.5v7"/></svg>
          </button>
        </div>

        <div id="keypad-grid" class="keypad-grid">
          <button class="key key-fn" type="button" data-act="clear" aria-label="清空当前行">C</button>
          <button class="key" type="button" data-ins="(" aria-label="左括号">(</button>
          <button class="key" type="button" data-ins=")" aria-label="右括号">)</button>
          <button class="key key-fn" type="button" data-act="back" aria-label="退格">
            <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5.5h9.5a1.5 1.5 0 011.5 1.5v10a1.5 1.5 0 01-1.5 1.5H9L3.6 12z"/><path d="M12.2 9.8l4.4 4.4M16.6 9.8l-4.4 4.4"/></svg>
          </button>

          <button class="key" type="button" data-ins="7">7</button>
          <button class="key" type="button" data-ins="8">8</button>
          <button class="key" type="button" data-ins="9">9</button>
          <button class="key key-op" type="button" data-ins="/" aria-label="除">÷</button>

          <button class="key" type="button" data-ins="4">4</button>
          <button class="key" type="button" data-ins="5">5</button>
          <button class="key" type="button" data-ins="6">6</button>
          <button class="key key-op" type="button" data-ins="*" aria-label="乘">×</button>

          <button class="key" type="button" data-ins="1">1</button>
          <button class="key" type="button" data-ins="2">2</button>
          <button class="key" type="button" data-ins="3">3</button>
          <button class="key key-op" type="button" data-ins="-" aria-label="减">−</button>

          <button class="key" type="button" data-ins="." aria-label="小数点">.</button>
          <button class="key" type="button" data-ins="0">0</button>
          <button class="key" type="button" data-ins="%" aria-label="百分号">%</button>
          <button class="key key-op" type="button" data-ins="+" aria-label="加">+</button>

          <button class="key key-enter" type="button" data-act="enter">
            <svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 4.5v6a2 2 0 01-2 2H4M7.5 9.5l-3.5 3 3.5 3"/></svg>
            <span>换行并携带结果</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="core.js"></script>
  <script src="app.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
